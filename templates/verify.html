{% extends "base.html" %}

{% block title %}{{ action }} Verification - ContactBook{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h2>{{ action }} Verification</h2>
    <p>Enter the OTP sent to <strong>{{ email }}</strong>.</p>
    <form method="post" class="auth-form">
      <input type="hidden" name="email" value="{{ email }}" />
      <div class="form-group">
        <label for="otp">OTP Code</label>
        <input id="otp" name="otp" type="text" required />
      </div>
      <div class="form-actions">
        <button class="button button-primary" type="submit">Verify OTP</button>
        <a class="button button-secondary" href="{{ url_for('login') }}">Back to Login</a>
      </div>
    </form>
  </section>
{% endblock %}
